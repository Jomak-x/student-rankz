name: Backend

on:
  pull_request:
  push:
    branches: [main, "polly/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database (ephemeral PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      # Inert value for the drizzle-kit CLI check only; never a real secret.
      DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Database tests (migration, constraints, repeatable seed)
        run: npm run test:db

      # Source slices may not carry both feature scripts yet. The integrated
      # package exposes every landed service suite.
      - name: Affiliation service tests when present
        run: npm run test:affiliation --if-present

      - name: Private draft service tests when present
        run: npm run test:drafts --if-present

      - name: Verify committed migrations apply via drizzle-kit
        run: npx drizzle-kit migrate

      - name: Verify seed CLI refuses to run without explicit opt-in
        run: |
          if npm run db:seed; then
            echo "::error::Seed CLI must refuse to run without SEED_SCOPE and --yes"
            exit 1
          fi
          echo "Seed CLI correctly refused without explicit opt-in"
