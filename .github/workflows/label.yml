name: Label PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# No checkout. No code execution. Reads changed-file list via GitHub API only.
permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: false
